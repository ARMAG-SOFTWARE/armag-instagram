# Monta o vídeo de um Reel e sobe no Supabase.
# Disparado pela tela /criativos (POST /api/criativos/gerar ou PATCH) via API do GitHub.
# Secrets do repositório: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY (e opcional SUPABASE_IG_BUCKET).
name: Montar Reel

on:
  workflow_dispatch:
    inputs:
      criativo_id:
        description: "id do criativo (tabela public.criativos)"
        required: true

concurrency:
  group: reel-${{ inputs.criativo_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  montar:
    runs-on: ubuntu-24.04 # o Playwright ainda não instala o Chromium no Ubuntu 26.04 (ubuntu-latest)
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_IG_BUCKET: ${{ secrets.SUPABASE_IG_BUCKET || 'instagram' }}
      PIPER_VOICES: ${{ github.workspace }}/.vozes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/reel/requirements.txt

      - name: Dependências
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r scripts/reel/requirements.txt

      - name: Voz do Jeff (Piper, CC0)
        uses: actions/cache@v4
        with:
          path: .vozes
          key: piper-pt_BR-jeff-medium-v1

      - name: Baixar a voz se não estiver em cache
        run: |
          mkdir -p .vozes
          base=https://huggingface.co/rhasspy/piper-voices/resolve/main/pt/pt_BR/jeff/medium
          for f in pt_BR-jeff-medium.onnx pt_BR-jeff-medium.onnx.json; do
            [ -s ".vozes/$f" ] || curl -fsSL -o ".vozes/$f" "$base/$f"
          done

      - name: Montar e subir o vídeo
        run: node scripts/reel/montar.mjs "${{ inputs.criativo_id }}"

      - name: Marcar erro se algo falhou antes da montagem
        if: failure()
        run: node scripts/reel/marcar-erro.mjs "${{ inputs.criativo_id }}" "O GitHub Actions falhou ao montar o vídeo (veja a aba Actions)."
