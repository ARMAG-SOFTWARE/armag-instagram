<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Massinha · barbearia</title>
<style>
@font-face { font-family: "Inter"; font-weight: 800; src: url(/criativos/marca/fonts/inter-latin-800-normal.woff2) format("woff2"); }
@font-face { font-family: "Inter"; font-weight: 600; src: url(/criativos/marca/fonts/inter-latin-600-normal.woff2) format("woff2"); }
@font-face { font-family: "Cinzel"; font-weight: 800; src: url(/criativos/marca/fonts/cinzel-latin-800-normal.woff2) format("woff2"); }
@font-face { font-family: "Inter"; font-weight: 700; src: url(/criativos/marca/fonts/inter-latin-700-normal.woff2) format("woff2"); }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
#palco { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
svg { position: absolute; inset: 0; }
.leg { position: absolute; left: 60px; right: 60px; top: 170px; text-align: center; font-family: Inter; font-weight: 800; color: #fff;
  font-size: 84px; line-height: 1.05; letter-spacing: 1px; text-transform: uppercase;
  -webkit-text-stroke: 9px #3a2416; paint-order: stroke fill; text-shadow: 0 10px 0 rgba(58,36,22,.35); }
.chip { position: absolute; left: 50%; top: 92px; transform: translateX(-50%); font-family: Inter; font-weight: 800; font-size: 34px;
  letter-spacing: 6px; padding: 14px 30px; border-radius: 999px; color: #fff; box-shadow: 0 8px 0 rgba(0,0,0,.25); }
#final { position: absolute; inset: 0; background: radial-gradient(900px 700px at 80% 8%, rgba(212,169,79,.20), transparent 60%), #070707;
  display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: #efe6d2; }
#final img { width: 330px; }
#final .marca { margin-top: 24px; font-family: Cinzel; font-weight: 800; font-size: 76px; letter-spacing: 14px;
  background: linear-gradient(180deg, #f3d58c, #d4a94f 55%, #8a6424); -webkit-background-clip: text; background-clip: text; color: transparent; }
#final .cta { margin-top: 64px; font-family: Inter; font-weight: 700; font-size: 56px; line-height: 1.2; color: #f3d58c; max-width: 860px; }
#final .sub { margin-top: 26px; font-family: Inter; font-weight: 600; font-size: 40px; color: #efe6d2; }
#final .bio { margin-top: 40px; font-family: Inter; font-weight: 800; font-size: 30px; letter-spacing: 4px; text-transform: uppercase; color: #070707;
  background: linear-gradient(180deg, #f3d58c, #d4a94f); padding: 18px 36px; border-radius: 999px; }
</style>
</head>
<body>
<div id="palco">
<svg viewBox="0 0 1080 1920" width="1080" height="1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- massinha: bordas que "fervem" (stop-motion), relevo macio e sombra de contato -->
    <filter id="clay" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence id="ferve" type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="2" result="n" />
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G" result="d" />
      <feGaussianBlur in="d" stdDeviation="7" result="b" />
      <feSpecularLighting in="b" surfaceScale="6" specularConstant="0.55" specularExponent="16" lighting-color="#fff6e8" result="s">
        <feDistantLight azimuth="235" elevation="52" />
      </feSpecularLighting>
      <feComposite in="s" in2="d" operator="in" result="s2" />
      <feComposite in="d" in2="s2" operator="arithmetic" k2="1" k3="0.5" result="lit" />
      <feDropShadow in="lit" dx="0" dy="10" stdDeviation="9" flood-color="#3a2416" flood-opacity="0.32" />
    </filter>
    <filter id="digitais"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="5" /><feColorMatrix values="0 0 0 0 0.25  0 0 0 0 0.16  0 0 0 0 0.09  0 0 0 0.10 0" /></filter>
    <radialGradient id="pele" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#f6c79c" /><stop offset="1" stop-color="#d9935f" /></radialGradient>
    <radialGradient id="pele2" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#c98a5c" /><stop offset="1" stop-color="#94592f" /></radialGradient>
    <linearGradient id="parede" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7dcb4" /><stop offset="1" stop-color="#eec08f" /></linearGradient>
    <linearGradient id="chao" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9774a" /><stop offset="1" stop-color="#93542e" /></linearGradient>
  </defs>

  <!-- cenário -->
  <rect width="1080" height="1920" fill="url(#parede)" />
  <rect x="0" y="1560" width="1080" height="400" fill="#93542e" />
  <g id="mundo" transform="translate(-118 150) scale(1.12)">
  <g id="cenario" filter="url(#clay)">
    <rect x="-20" y="1430" width="1120" height="520" rx="30" fill="url(#chao)" />
    <rect x="150" y="470" width="560" height="430" rx="70" fill="#9fd3d6" stroke="#7a4a2a" stroke-width="22" />
    <path d="M210 540 q60 -30 120 0" stroke="#e6fbfb" stroke-width="16" fill="none" stroke-linecap="round" />
    <!-- poste de barbearia -->
    <rect x="860" y="430" width="70" height="330" rx="35" fill="#fdf3e6" />
    <path d="M868 470 l55 40 M868 540 l55 40 M868 610 l55 40 M868 680 l55 40" stroke="#d6453a" stroke-width="20" stroke-linecap="round" />
    <path d="M880 450 l45 30 M880 520 l45 30" stroke="#3b6fb6" stroke-width="10" stroke-linecap="round" opacity=".7"/>
  </g>

  <!-- cliente na cadeira -->
  <g id="cliente" filter="url(#clay)">
    <rect x="200" y="1260" width="360" height="90" rx="40" fill="#b8432f" />
    <rect x="345" y="1340" width="70" height="140" rx="20" fill="#5b3a29" />
    <ellipse cx="380" cy="1490" rx="150" ry="30" fill="#5b3a29" />
    <path d="M230 1290 q150 -330 300 0 z" fill="#eef1f3" />
    <circle cx="380" cy="980" r="98" fill="url(#pele2)" />
    <path d="M285 960 q95 -150 190 0 q-30 -40 -95 -45 q-65 5 -95 45z" fill="#2c1a10" />
    <circle cx="350" cy="990" r="11" fill="#1d120c" /><circle cx="410" cy="990" r="11" fill="#1d120c" />
    <path id="bocaCli" d="M355 1035 q25 14 50 0" stroke="#5b2b18" stroke-width="9" fill="none" stroke-linecap="round" />
  </g>

  <!-- barbeiro -->
  <g id="barbeiro" filter="url(#clay)">
    <path d="M560 1480 q-10 -330 110 -400 q120 70 110 400 z" fill="#2f6f73" />
    <rect x="585" y="1460" width="70" height="60" rx="25" fill="#3a2416" /><rect x="685" y="1460" width="70" height="60" rx="25" fill="#3a2416" />
    <path d="M610 1110 q60 40 120 0 l-10 260 q-50 25 -100 0z" fill="#f2e6d6" opacity=".9" />
    <g id="bracoTesoura">
      <path d="M590 1130 q-70 30 -120 -40" stroke="#2f6f73" stroke-width="58" fill="none" stroke-linecap="round" />
      <circle cx="465" cy="1080" r="34" fill="url(#pele)" />
      <g id="tesoura" transform="translate(445 1035)">
        <g id="lamina1"><rect x="-6" y="-80" width="14" height="80" rx="7" fill="#c9d1d8" /></g>
        <g id="lamina2"><rect x="-6" y="-80" width="14" height="80" rx="7" fill="#aeb8c1" /></g>
        <circle cx="-14" cy="12" r="16" fill="none" stroke="#e05a3a" stroke-width="9" /><circle cx="18" cy="12" r="16" fill="none" stroke="#e05a3a" stroke-width="9" />
      </g>
    </g>
    <g id="bracoLivre">
      <path id="bracoLivrePath" d="M745 1130 q60 60 50 160" stroke="#2f6f73" stroke-width="58" fill="none" stroke-linecap="round" />
      <circle id="maoLivre" cx="795" cy="1295" r="34" fill="url(#pele)" />
      <g id="joinha" opacity="0"><rect x="776" y="1180" width="22" height="58" rx="11" fill="url(#pele)" /></g>
    </g>
    <g id="cabeca">
      <circle cx="670" cy="900" r="112" fill="url(#pele)" />
      <path d="M560 875 q20 -120 110 -125 q95 5 112 125 q-40 -55 -110 -60 q-70 5 -112 60z" fill="#3a2416" />
      <g id="olhos">
        <ellipse cx="630" cy="905" rx="20" ry="24" fill="#fff" /><ellipse cx="712" cy="905" rx="20" ry="24" fill="#fff" />
        <circle id="pupila1" cx="634" cy="908" r="10" fill="#1d120c" /><circle id="pupila2" cx="716" cy="908" r="10" fill="#1d120c" />
      </g>
      <g id="olhosFelizes" opacity="0">
        <path d="M612 908 q18 -20 36 0" stroke="#1d120c" stroke-width="9" fill="none" stroke-linecap="round" />
        <path d="M694 908 q18 -20 36 0" stroke="#1d120c" stroke-width="9" fill="none" stroke-linecap="round" />
      </g>
      <path id="sobr1" d="M608 868 l42 -8" stroke="#3a2416" stroke-width="11" stroke-linecap="round" />
      <path id="sobr2" d="M692 860 l42 8" stroke="#3a2416" stroke-width="11" stroke-linecap="round" />
      <path d="M622 965 q48 -28 96 0 q-48 -8 -96 0z" fill="#3a2416" stroke="#3a2416" stroke-width="10" stroke-linejoin="round" />
      <path id="boca" d="M640 990 q30 -14 60 0" stroke="#7a2e1c" stroke-width="10" fill="none" stroke-linecap="round" />
      <g id="suor" opacity="0"><path d="M778 850 q14 22 0 34 q-14 -12 0 -34z" fill="#8fd3f0" /><path d="M565 880 q12 20 0 30 q-12 -10 0 -30z" fill="#8fd3f0" /></g>
    </g>
  </g>

  <!-- balcão e celular -->
  <g id="balcao" filter="url(#clay)">
    <rect x="760" y="1340" width="330" height="260" rx="30" fill="#8a5a3b" />
    <rect x="745" y="1320" width="360" height="50" rx="22" fill="#a8714b" />
  </g>
  <g id="celular" filter="url(#clay)">
    <g id="celGiro">
      <rect x="-90" y="-170" width="180" height="340" rx="34" fill="#2b2f36" />
      <rect x="-74" y="-150" width="148" height="300" rx="22" fill="#e9f3ff" />
      <g id="telaMsgs"></g>
      <g id="telaAgenda" opacity="0"></g>
    </g>
  </g>
  <g id="badgeG" filter="url(#clay)"><circle cx="0" cy="0" r="44" fill="#e53935" /><text id="badge" x="0" y="15" text-anchor="middle" font-family="Inter" font-weight="800" font-size="42" fill="#fff">0</text></g>

  </g>
  <rect width="1080" height="1920" filter="url(#digitais)" />
</svg>
<div class="chip" id="chip"></div>
<div class="leg" id="leg"></div>
<div id="final" style="display:none">
  <img src="/criativos/marca/brasao-transparente.png" alt="" />
  <div class="marca">ARMAG</div>
  <div class="cta" id="cta"></div>
  <div class="sub">@armag.soft</div>
  <div class="bio">link na bio</div>
</div>
</div>
<script>
const D = window.DADOS;
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const back = (k) => { const c1 = 1.7, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
const SVGNS = "http://www.w3.org/2000/svg";
const el = (tag, at) => { const e = document.createElementNS(SVGNS, tag); for (const k in at) e.setAttribute(k, at[k]); return e; };

// telas do celular
const msgs = [], slots = [];
(() => {
  const g = $("telaMsgs");
  for (let i = 0; i < 5; i++) {
    const b = el("g", { opacity: 0 });
    b.appendChild(el("rect", { x: -64, y: -135 + i * 56, width: 128, height: 46, rx: 14, fill: "#2fbf71" }));
    b.appendChild(el("rect", { x: -50, y: -122 + i * 56, width: 80, height: 8, rx: 4, fill: "#e9fff2" }));
    b.appendChild(el("rect", { x: -50, y: -106 + i * 56, width: 56, height: 8, rx: 4, fill: "#e9fff2" }));
    g.appendChild(b); msgs.push(b);
  }
  const a = $("telaAgenda");
  a.appendChild(el("rect", { x: -64, y: -140, width: 128, height: 34, rx: 10, fill: "#d4a94f" }));
  for (let i = 0; i < 5; i++) {
    const s = el("g", {});
    s.appendChild(el("rect", { x: -64, y: -96 + i * 48, width: 128, height: 40, rx: 12, fill: "#dfe7ef" }));
    const ok = el("g", { opacity: 0 });
    ok.appendChild(el("rect", { x: -64, y: -96 + i * 48, width: 128, height: 40, rx: 12, fill: "#34c27a" }));
    ok.appendChild(el("path", { d: `M-44 ${-76 + i * 48} l10 10 l20 -22`, stroke: "#fff", "stroke-width": 7, fill: "none", "stroke-linecap": "round", "stroke-linejoin": "round" }));
    s.appendChild(ok); a.appendChild(s); slots.push(ok);
  }
})();

const C = D.cenas;
const legendas = [
  { t0: C.s1a, t1: C.s1b - 0.1, txt: "O celular\nnão para", chip: "ANTES", cor: "#d6453a" },
  { t0: C.s1b, t1: C.virada - 0.1, txt: "Cliente esperando =\ncliente perdido", chip: "ANTES", cor: "#d6453a" },
  { t0: C.virada, t1: C.s2 - 0.05, txt: "E se fosse\nassim?", chip: "", cor: "" },
  { t0: C.s2, t1: C.final - 0.1, txt: "O cliente agenda\nsozinho", chip: "DEPOIS", cor: "#2f9e5b" },
];
$("cta").textContent = D.cta;

window.renderFrame = (t) => {
  const tq = Math.floor(t * 12) / 12;               // movimento dos bonecos a 12 qps (cara de stop-motion)
  $("ferve").setAttribute("seed", String(2 + (Math.floor(t * 8) % 3)));  // bordas "fervendo"
  const depois = t >= C.s2;
  const virada = t >= C.virada && t < C.s2;

  // tesoura cortando (antes) / parada (depois)
  const corte = depois ? 0 : Math.sin(tq * 14) * 14;
  $("lamina1").setAttribute("transform", `rotate(${-8 + corte})`);
  $("lamina2").setAttribute("transform", `rotate(${8 - corte})`);
  $("bracoTesoura").setAttribute("transform", depois ? "translate(0 30) rotate(8 590 1130)" : `rotate(${Math.sin(tq * 3) * 3} 590 1130)`);

  // celular: vibra e enche de mensagens (antes) · agenda se preenchendo sozinha (depois)
  const vib = !depois && !virada ? Math.sin(tq * 60) * (Math.floor(tq * 2) % 2 ? 7 : 2) : 0;
  $("celular").setAttribute("transform", `translate(${905 + vib} 1160) rotate(${-8 + vib * 0.6})`);
  let n = 0;
  msgs.forEach((m, i) => { const ti = C.s1a + 0.25 + i * ((C.virada - C.s1a - 0.8) / 5); const k = prog(tq, ti, ti + 0.25); m.setAttribute("opacity", depois ? 0 : k); if (tq >= ti) n++; });
  $("badge").textContent = depois ? "0" : String(n * 3 + (n ? 2 : 0));
  const bk = n && !depois ? back(prog(tq, C.s1a + 0.25, C.s1a + 0.6)) : 0;
  $("badgeG").setAttribute("transform", `translate(${975 + vib} 985) scale(${bk.toFixed(3)})`);
  $("telaMsgs").setAttribute("opacity", depois ? 0 : 1);
  $("telaAgenda").setAttribute("opacity", depois ? 1 : 0);
  slots.forEach((s, i) => { const ti = C.s2 + 0.5 + i * 0.55; s.setAttribute("opacity", prog(tq, ti, ti + 0.15)); });

  // rosto: aflito (antes) · feliz (depois)
  const olhaCel = !depois && Math.floor(tq * 1.5) % 2 === 1;
  $("pupila1").setAttribute("cx", olhaCel ? 644 : 628); $("pupila2").setAttribute("cx", olhaCel ? 726 : 710);
  $("olhos").setAttribute("opacity", depois ? 0 : 1); $("olhosFelizes").setAttribute("opacity", depois ? 1 : 0);
  $("sobr1").setAttribute("d", depois ? "M608 860 l42 0" : "M608 872 l42 -16");
  $("sobr2").setAttribute("d", depois ? "M692 860 l42 0" : "M692 856 l42 16");
  $("boca").setAttribute("d", depois ? "M630 982 q40 40 80 0" : `M640 ${992 + Math.sin(tq * 9) * 3} q15 -12 30 0 q15 12 30 0`);
  $("suor").setAttribute("opacity", !depois && t > C.s1b ? 1 : 0);
  $("suor").setAttribute("transform", `translate(0 ${(tq * 40) % 30})`);
  $("bocaCli").setAttribute("d", depois ? "M352 1030 q28 22 56 0" : "M355 1040 q25 -10 50 0");
  // joinha no depois
  const kj = back(prog(tq, C.s2 + 2.4, C.s2 + 2.9));
  $("joinha").setAttribute("opacity", kj > 0 ? 1 : 0);
  $("bracoLivrePath").setAttribute("d", kj > 0 ? "M745 1130 q70 -20 60 -110" : "M745 1130 q60 60 50 160");
  $("maoLivre").setAttribute("cy", kj > 0 ? 1030 : 1295); $("maoLivre").setAttribute("cx", kj > 0 ? 805 : 795);
  $("joinha").setAttribute("transform", kj > 0 ? `translate(10 -230) scale(${(0.6 + 0.4 * kj).toFixed(3)})` : "");
  // pulinho na virada
  const pulo = virada ? -Math.abs(Math.sin((tq - C.virada) * 6)) * 30 : 0;
  $("barbeiro").setAttribute("transform", `translate(0 ${pulo})`);

  // legendas e chip
  const L = legendas.find((l) => t >= l.t0 && t < l.t1);
  const leg = $("leg"), chip = $("chip");
  if (L) {
    leg.style.display = ""; leg.innerHTML = L.txt.replace(/\n/g, "<br>");
    const k = back(prog(t, L.t0, L.t0 + 0.35));
    leg.style.transform = `scale(${(0.6 + 0.4 * k).toFixed(3)}) rotate(${(1 - k) * -4}deg)`;
    leg.style.top = L.chip ? "190px" : "250px"; leg.style.fontSize = L.chip ? "84px" : "120px";
    chip.style.display = L.chip ? "" : "none"; chip.textContent = L.chip; chip.style.background = L.cor;
  } else { leg.style.display = "none"; chip.style.display = "none"; }

  // cartão final ARMAG
  const fin = $("final");
  fin.style.display = t >= C.final - 0.25 ? "flex" : "none";
  const kf = prog(t, C.final - 0.25, C.final + 0.2);
  fin.style.clipPath = `circle(${(kf * 150).toFixed(1)}% at 50% 55%)`;
};

window.ready = (async () => { await document.fonts.ready; await Promise.all([...document.images].map((i) => (i.complete ? 0 : i.decode().catch(() => {})))); return true; })();
</script>
</body>
</html>
