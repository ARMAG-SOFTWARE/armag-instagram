<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Massinha · barbearia (v2)</title>
<style>
@font-face { font-family: "Inter"; font-weight: 800; src: url(/criativos/marca/fonts/inter-latin-800-normal.woff2) format("woff2"); }
@font-face { font-family: "Inter"; font-weight: 700; src: url(/criativos/marca/fonts/inter-latin-700-normal.woff2) format("woff2"); }
@font-face { font-family: "Inter"; font-weight: 600; src: url(/criativos/marca/fonts/inter-latin-600-normal.woff2) format("woff2"); }
@font-face { font-family: "Cinzel"; font-weight: 800; src: url(/criativos/marca/fonts/cinzel-latin-800-normal.woff2) format("woff2"); }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
#palco { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
.camada { position: absolute; inset: 0; }
svg { position: absolute; inset: 0; }
.leg { position: absolute; left: 50px; right: 50px; top: 190px; text-align: center; font-family: Inter; font-weight: 800; color: #fff;
  font-size: 84px; line-height: 1.05; letter-spacing: 1px; text-transform: uppercase;
  -webkit-text-stroke: 10px #241133; paint-order: stroke fill; text-shadow: 0 10px 0 rgba(36,17,51,.35); z-index: 5; }
.chip { position: absolute; left: 50%; top: 92px; transform: translateX(-50%); font-family: Inter; font-weight: 800; font-size: 34px; z-index: 5;
  letter-spacing: 5px; padding: 14px 30px; border-radius: 999px; color: #fff; box-shadow: 0 8px 0 rgba(0,0,0,.25); white-space: nowrap; }
/* cena do sistema: celular de massinha com as telas reais do site */
#demo { background: radial-gradient(900px 900px at 50% 45%, #ffe45c, #ffb627 60%, #ff8f1f); }
#cel { position: absolute; left: 270px; top: 470px; width: 540px; height: 990px; border-radius: 80px; background: #2a1f3d; padding: 22px;
  box-shadow: inset 0 -18px 0 rgba(0,0,0,.25), inset 0 14px 0 rgba(255,255,255,.12), 0 30px 0 rgba(120,50,0,.25), 0 40px 60px rgba(120,50,0,.35); }
#tela { position: relative; width: 496px; height: 882px; border-radius: 58px; overflow: hidden; background: #0a0a0a; }
#tela img { position: absolute; left: 0; top: 0; width: 496px; height: 882px; opacity: 0; }
#toque { position: absolute; width: 90px; height: 90px; margin: -45px 0 0 -45px; border-radius: 50%; border: 8px solid #fff; background: rgba(255,255,255,.35); opacity: 0; }
#dedo { position: absolute; width: 96px; height: 240px; border-radius: 48px; background: radial-gradient(circle at 35% 25%, #f9cfa6, #e09a62 70%);
  box-shadow: inset -10px -14px 0 rgba(0,0,0,.12), 0 16px 24px rgba(0,0,0,.25); }
#dedo::after { content: ""; position: absolute; left: 22px; top: 14px; width: 52px; height: 52px; border-radius: 22px; background: #ffe3d0; opacity: .9; }
#ok { position: absolute; left: 50%; top: 860px; width: 300px; height: 300px; margin-left: -150px; border-radius: 50%; background: #2fbf71; color: #fff;
  display: flex; align-items: center; justify-content: center; font: 800 190px Inter; box-shadow: inset 0 -16px 0 rgba(0,0,0,.2), 0 20px 0 rgba(0,90,40,.3); opacity: 0; }
#final { position: absolute; inset: 0; background: radial-gradient(900px 700px at 80% 8%, rgba(212,169,79,.20), transparent 60%), #070707;
  display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: #efe6d2; z-index: 6; }
#final img { width: 330px; }
#final .marca { margin-top: 24px; font-family: Cinzel; font-weight: 800; font-size: 76px; letter-spacing: 14px;
  background: linear-gradient(180deg, #f3d58c, #d4a94f 55%, #8a6424); -webkit-background-clip: text; background-clip: text; color: transparent; }
#final .cta { margin-top: 64px; font-family: Inter; font-weight: 700; font-size: 56px; line-height: 1.2; color: #f3d58c; max-width: 860px; }
#final .sub { margin-top: 26px; font-family: Inter; font-weight: 600; font-size: 40px; color: #efe6d2; }
#final .bio { margin-top: 40px; font-family: Inter; font-weight: 800; font-size: 30px; letter-spacing: 4px; text-transform: uppercase; color: #070707;
  background: linear-gradient(180deg, #f3d58c, #d4a94f); padding: 18px 36px; border-radius: 999px; }
</style>
</head>
<body>
<div id="palco">
<!-- ===== barbearia ===== -->
<div class="camada" id="loja">
<svg viewBox="0 0 1080 1920" width="1080" height="1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="clay" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence id="ferve" type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="2" result="n" />
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G" result="d" />
      <feGaussianBlur in="d" stdDeviation="7" result="b" />
      <feSpecularLighting in="b" surfaceScale="6" specularConstant="0.6" specularExponent="16" lighting-color="#ffffff" result="s"><feDistantLight azimuth="235" elevation="52" /></feSpecularLighting>
      <feComposite in="s" in2="d" operator="in" result="s2" />
      <feComposite in="d" in2="s2" operator="arithmetic" k2="1" k3="0.5" result="lit" />
      <feDropShadow in="lit" dx="0" dy="10" stdDeviation="9" flood-color="#241133" flood-opacity="0.32" />
    </filter>
    <filter id="digitais"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="5" /><feColorMatrix values="0 0 0 0 0.14  0 0 0 0 0.07  0 0 0 0 0.2  0 0 0 0.08 0" /></filter>
    <radialGradient id="pele" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#ffd2a8" /><stop offset="1" stop-color="#ec9a5e" /></radialGradient>
    <radialGradient id="pele2" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#d9935f" /><stop offset="1" stop-color="#9c5a2c" /></radialGradient>
    <linearGradient id="parede" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2fd6c3" /><stop offset="1" stop-color="#17a99a" /></linearGradient>
    <pattern id="xadrez" width="120" height="120" patternUnits="userSpaceOnUse"><rect width="120" height="120" fill="#fbf6ec" /><rect width="60" height="60" fill="#2b2140" /><rect x="60" y="60" width="60" height="60" fill="#2b2140" /></pattern>
  </defs>
  <rect width="1080" height="1920" fill="url(#parede)" />
  <path d="M0 330 h1080" stroke="#ffd23f" stroke-width="26" />
  <rect x="0" y="1560" width="1080" height="400" fill="url(#xadrez)" />
  <g id="mundo" transform="translate(-118 150) scale(1.12)">
  <g filter="url(#clay)">
    <rect x="-20" y="1430" width="1120" height="520" rx="20" fill="url(#xadrez)" />
    <rect x="150" y="470" width="560" height="430" rx="70" fill="#bff3ff" stroke="#ff6b35" stroke-width="24" />
    <path d="M210 540 q60 -30 120 0" stroke="#ffffff" stroke-width="16" fill="none" stroke-linecap="round" />
    <rect x="860" y="430" width="70" height="330" rx="35" fill="#ffffff" />
    <path d="M868 470 l55 40 M868 540 l55 40 M868 610 l55 40 M868 680 l55 40" stroke="#ff2e3b" stroke-width="20" stroke-linecap="round" />
    <path d="M868 505 l55 40 M868 575 l55 40 M868 645 l55 40" stroke="#2f6bff" stroke-width="12" stroke-linecap="round" />
  </g>
  <g id="cliente" filter="url(#clay)">
    <rect x="200" y="1260" width="360" height="90" rx="40" fill="#ff2e3b" />
    <rect x="345" y="1340" width="70" height="140" rx="20" fill="#c7ced6" />
    <ellipse cx="380" cy="1490" rx="150" ry="30" fill="#9aa6b2" />
    <path d="M230 1290 q150 -330 300 0 z" fill="#2f6bff" />
    <circle cx="380" cy="980" r="98" fill="url(#pele2)" />
    <path d="M285 960 q95 -150 190 0 q-30 -40 -95 -45 q-65 5 -95 45z" fill="#2a1406" />
    <circle cx="350" cy="990" r="11" fill="#1d120c" /><circle cx="410" cy="990" r="11" fill="#1d120c" />
    <path id="bocaCli" d="M355 1035 q25 14 50 0" stroke="#6b220f" stroke-width="9" fill="none" stroke-linecap="round" />
  </g>
  <g id="barbeiro" filter="url(#clay)">
    <path d="M560 1480 q-10 -330 110 -400 q120 70 110 400 z" fill="#8a3ffc" />
    <rect x="585" y="1460" width="70" height="60" rx="25" fill="#241133" /><rect x="685" y="1460" width="70" height="60" rx="25" fill="#241133" />
    <path d="M610 1110 q60 40 120 0 l-10 260 q-50 25 -100 0z" fill="#ffd23f" />
    <g id="bracoTesoura">
      <path d="M590 1130 q-70 30 -120 -40" stroke="#8a3ffc" stroke-width="58" fill="none" stroke-linecap="round" />
      <circle cx="465" cy="1080" r="34" fill="url(#pele)" />
      <g transform="translate(445 1035)">
        <g id="lamina1"><rect x="-6" y="-80" width="14" height="80" rx="7" fill="#e3e9ef" /></g>
        <g id="lamina2"><rect x="-6" y="-80" width="14" height="80" rx="7" fill="#c3ccd6" /></g>
        <circle cx="-14" cy="12" r="16" fill="none" stroke="#ff2e3b" stroke-width="9" /><circle cx="18" cy="12" r="16" fill="none" stroke="#ff2e3b" stroke-width="9" />
      </g>
    </g>
    <g>
      <path id="bracoLivrePath" d="M745 1130 q60 60 50 160" stroke="#8a3ffc" stroke-width="58" fill="none" stroke-linecap="round" />
      <circle id="maoLivre" cx="795" cy="1295" r="34" fill="url(#pele)" />
      <g id="joinha" opacity="0"><rect x="776" y="1180" width="22" height="58" rx="11" fill="url(#pele)" /></g>
    </g>
    <g>
      <circle cx="670" cy="900" r="112" fill="url(#pele)" />
      <path d="M560 875 q20 -120 110 -125 q95 5 112 125 q-40 -55 -110 -60 q-70 5 -112 60z" fill="#2a1406" />
      <g id="olhos">
        <ellipse cx="630" cy="905" rx="20" ry="24" fill="#fff" /><ellipse cx="712" cy="905" rx="20" ry="24" fill="#fff" />
        <circle id="pupila1" cx="634" cy="908" r="10" fill="#1d120c" /><circle id="pupila2" cx="716" cy="908" r="10" fill="#1d120c" />
      </g>
      <g id="olhosFelizes" opacity="0">
        <path d="M612 908 q18 -20 36 0" stroke="#1d120c" stroke-width="9" fill="none" stroke-linecap="round" />
        <path d="M694 908 q18 -20 36 0" stroke="#1d120c" stroke-width="9" fill="none" stroke-linecap="round" />
      </g>
      <path id="sobr1" d="M608 868 l42 -8" stroke="#2a1406" stroke-width="11" stroke-linecap="round" />
      <path id="sobr2" d="M692 860 l42 8" stroke="#2a1406" stroke-width="11" stroke-linecap="round" />
      <path d="M622 965 q48 -28 96 0 q-48 -8 -96 0z" fill="#2a1406" stroke="#2a1406" stroke-width="10" stroke-linejoin="round" />
      <path id="boca" d="M640 990 q30 -14 60 0" stroke="#a3221a" stroke-width="10" fill="none" stroke-linecap="round" />
      <ellipse cx="612" cy="945" rx="16" ry="10" fill="#ff7d7d" opacity=".55" /><ellipse cx="730" cy="945" rx="16" ry="10" fill="#ff7d7d" opacity=".55" />
      <g id="suor" opacity="0"><path d="M778 850 q14 22 0 34 q-14 -12 0 -34z" fill="#5fd0ff" /><path d="M565 880 q12 20 0 30 q-12 -10 0 -30z" fill="#5fd0ff" /></g>
    </g>
  </g>
  <g filter="url(#clay)">
    <rect x="760" y="1340" width="330" height="260" rx="30" fill="#ff6b35" />
    <rect x="745" y="1320" width="360" height="50" rx="22" fill="#ffd23f" />
  </g>
  <g id="celular" filter="url(#clay)">
    <rect x="-90" y="-170" width="180" height="340" rx="34" fill="#241133" />
    <rect x="-74" y="-150" width="148" height="300" rx="22" fill="#f2f7ff" />
    <g id="telaMsgs"></g>
    <g id="telaAgenda" opacity="0"></g>
  </g>
  <g id="badgeG" filter="url(#clay)"><circle cx="0" cy="0" r="44" fill="#ff2e3b" /><text id="badge" x="0" y="15" text-anchor="middle" font-family="Inter" font-weight="800" font-size="42" fill="#fff">0</text></g>
  <g id="notif" filter="url(#clay)" opacity="0">
    <rect x="-210" y="-60" width="420" height="120" rx="34" fill="#ffffff" />
    <circle cx="-150" cy="0" r="34" fill="#2fbf71" /><path d="M-166 0 l12 12 l22 -24" stroke="#fff" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="-100" y="-10" font-family="Inter" font-weight="800" font-size="30" fill="#241133">Novo agendamento</text>
    <text x="-100" y="30" font-family="Inter" font-weight="600" font-size="26" fill="#5b4a6b">Corte + Barba · 10:00</text>
  </g>
  </g>
  <rect width="1080" height="1920" filter="url(#digitais)" />
</svg>
</div>

<!-- ===== o sistema funcionando (telas reais) ===== -->
<div class="camada" id="demo" style="display:none">
  <div id="cel"><div id="tela">
    <img id="t0" src="telas/servico.jpg" /><img id="t1" src="telas/barbeiro.jpg" /><img id="t2" src="telas/horario.jpg" /><img id="t3" src="telas/resumo.jpg" />
    <div id="toque"></div>
  </div></div>
  <div id="dedo"></div>
  <div id="ok">✓</div>
</div>

<div class="chip" id="chip"></div>
<div class="leg" id="leg"></div>
<div id="final" style="display:none">
  <img src="/criativos/marca/brasao-transparente.png" alt="" />
  <div class="marca">ARMAG</div>
  <div class="cta" id="cta"></div>
  <div class="sub">@armag.soft</div>
  <div class="bio">link na bio</div>
</div>
</div>
<script>
const D = window.DADOS;
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const back = (k) => { const c1 = 1.7, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
const inOut = (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
const SVGNS = "http://www.w3.org/2000/svg";
const el = (tag, at) => { const e = document.createElementNS(SVGNS, tag); for (const k in at) e.setAttribute(k, at[k]); return e; };

const msgs = [], slots = [];
(() => {
  const g = $("telaMsgs");
  for (let i = 0; i < 5; i++) {
    const b = el("g", { opacity: 0 });
    b.appendChild(el("rect", { x: -64, y: -135 + i * 56, width: 128, height: 46, rx: 14, fill: "#2fbf71" }));
    b.appendChild(el("rect", { x: -50, y: -122 + i * 56, width: 80, height: 8, rx: 4, fill: "#e9fff2" }));
    b.appendChild(el("rect", { x: -50, y: -106 + i * 56, width: 56, height: 8, rx: 4, fill: "#e9fff2" }));
    g.appendChild(b); msgs.push(b);
  }
  const a = $("telaAgenda");
  a.appendChild(el("rect", { x: -64, y: -140, width: 128, height: 34, rx: 10, fill: "#8a3ffc" }));
  for (let i = 0; i < 5; i++) {
    a.appendChild(el("rect", { x: -64, y: -96 + i * 48, width: 128, height: 40, rx: 12, fill: "#dfe7ef" }));
    const ok = el("g", { opacity: 0 });
    ok.appendChild(el("rect", { x: -64, y: -96 + i * 48, width: 128, height: 40, rx: 12, fill: "#2fbf71" }));
    ok.appendChild(el("path", { d: `M-44 ${-76 + i * 48} l10 10 l20 -22`, stroke: "#fff", "stroke-width": 7, fill: "none", "stroke-linecap": "round", "stroke-linejoin": "round" }));
    a.appendChild(ok); slots.push(ok);
  }
})();

const C = D.cenas;
// passos do agendamento: tela, alvo do toque (coordenadas da gravação 1080×1920) e legenda
const ESC = 496 / 1080;
const PASSOS = [
  { tela: 0, alvo: [540, 1118], chip: "1 · SERVIÇO", leg: "Escolhe\no serviço" },
  { tela: 1, alvo: [540, 1002], chip: "2 · BARBEIRO", leg: "Escolhe\no barbeiro" },
  { tela: 2, alvo: [165, 1116], chip: "3 · HORÁRIO", leg: "Só horário\nlivre" },
];
const passoT = (i) => C.demo + 0.4 + i * ((C.depois - C.demo - 0.9) / 3);
const legendas = [
  { t0: C.s1a, t1: C.s1b - 0.1, txt: "O celular\nnão para", chip: "ANTES", cor: "#ff2e3b" },
  { t0: C.s1b, t1: C.virada - 0.1, txt: "Cliente esperando =\ncliente perdido", chip: "ANTES", cor: "#ff2e3b" },
  { t0: C.virada, t1: C.demo - 0.05, txt: "E se fosse\nassim?", chip: "", cor: "" },
  // a legenda do passo acompanha a tela em que o toque acontece
  ...PASSOS.map((p, i) => ({ t0: i === 0 ? C.demo + 0.05 : passoT(i - 1) + 0.55, t1: i < 2 ? passoT(i) + 0.55 : C.confirma, txt: p.leg, chip: p.chip, cor: "#8a3ffc" })),
  { t0: C.confirma, t1: C.depois, txt: "Agendado!", chip: "PRONTO", cor: "#2f9e5b" },
  { t0: C.depois, t1: C.final - 0.1, txt: "E você nem\nparou o corte", chip: "DEPOIS", cor: "#2f9e5b" },
];
$("cta").textContent = D.cta;

window.renderFrame = (t) => {
  const tq = Math.floor(t * 12) / 12;
  $("ferve").setAttribute("seed", String(2 + (Math.floor(t * 8) % 3)));
  const depois = t >= C.depois;
  const virada = t >= C.virada && t < C.demo;
  const naDemo = t >= C.demo - 0.2 && t < C.depois;

  // ----- barbearia -----
  const corte = depois ? 0 : Math.sin(tq * 14) * 14;
  $("lamina1").setAttribute("transform", `rotate(${-8 + corte})`);
  $("lamina2").setAttribute("transform", `rotate(${8 - corte})`);
  $("bracoTesoura").setAttribute("transform", `rotate(${Math.sin(tq * 3) * 3} 590 1130)`);
  const vib = !depois && !virada ? Math.sin(tq * 60) * (Math.floor(tq * 2) % 2 ? 7 : 2) : 0;
  $("celular").setAttribute("transform", `translate(${905 + vib} 1160) rotate(${-8 + vib * 0.6})`);
  let n = 0;
  msgs.forEach((m, i) => { const ti = C.s1a + 0.25 + i * ((C.virada - C.s1a - 0.8) / 5); m.setAttribute("opacity", depois ? 0 : prog(tq, ti, ti + 0.25)); if (tq >= ti) n++; });
  $("badge").textContent = String(n * 3 + (n ? 2 : 0));
  const bk = n && !depois ? back(prog(tq, C.s1a + 0.25, C.s1a + 0.6)) : 0;
  $("badgeG").setAttribute("transform", `translate(${975 + vib} 985) scale(${bk.toFixed(3)})`);
  $("telaMsgs").setAttribute("opacity", depois ? 0 : 1);
  $("telaAgenda").setAttribute("opacity", depois ? 1 : 0);
  slots.forEach((s, i) => { const ti = C.depois + 0.3 + i * 0.35; s.setAttribute("opacity", prog(tq, ti, ti + 0.15)); });
  const kn = back(prog(tq, C.depois + 0.2, C.depois + 0.6));
  $("notif").setAttribute("opacity", depois ? 1 : 0);
  $("notif").setAttribute("transform", `translate(820 ${lerp(760, 820, kn)}) scale(${(0.5 + 0.5 * kn).toFixed(3)})`);
  const olhaCel = !depois && Math.floor(tq * 1.5) % 2 === 1;
  $("pupila1").setAttribute("cx", olhaCel ? 644 : 628); $("pupila2").setAttribute("cx", olhaCel ? 726 : 710);
  $("olhos").setAttribute("opacity", depois ? 0 : 1); $("olhosFelizes").setAttribute("opacity", depois ? 1 : 0);
  $("sobr1").setAttribute("d", depois ? "M608 860 l42 0" : "M608 872 l42 -16");
  $("sobr2").setAttribute("d", depois ? "M692 860 l42 0" : "M692 856 l42 16");
  $("boca").setAttribute("d", depois ? "M630 982 q40 40 80 0" : `M640 ${992 + Math.sin(tq * 9) * 3} q15 -12 30 0 q15 12 30 0`);
  $("suor").setAttribute("opacity", !depois && t > C.s1b ? 1 : 0);
  $("suor").setAttribute("transform", `translate(0 ${(tq * 40) % 30})`);
  $("bocaCli").setAttribute("d", depois ? "M352 1030 q28 22 56 0" : "M355 1040 q25 -10 50 0");
  const kj = back(prog(tq, C.depois + 1.2, C.depois + 1.6));
  $("joinha").setAttribute("opacity", kj > 0 ? 1 : 0);
  $("bracoLivrePath").setAttribute("d", kj > 0 ? "M745 1130 q70 -20 60 -110" : "M745 1130 q60 60 50 160");
  $("maoLivre").setAttribute("cy", kj > 0 ? 1030 : 1295); $("maoLivre").setAttribute("cx", kj > 0 ? 805 : 795);
  $("joinha").setAttribute("transform", kj > 0 ? `translate(10 -230) scale(${(0.6 + 0.4 * kj).toFixed(3)})` : "");
  const pulo = virada ? -Math.abs(Math.sin((tq - C.virada) * 6)) * 30 : 0;
  $("barbeiro").setAttribute("transform", `translate(0 ${pulo})`);
  // transição: a câmera "entra" no celular e depois volta
  const entra = inOut(prog(t, C.demo - 0.45, C.demo - 0.05)) * (1 - inOut(prog(t, C.depois - 0.05, C.depois + 0.4)));
  $("loja").style.transform = `scale(${lerp(1, 2.4, entra).toFixed(3)})`;
  $("loja").style.transformOrigin = "84% 60%";
  $("loja").style.display = naDemo && t > C.demo ? "none" : "";

  // ----- o sistema funcionando -----
  const demo = $("demo");
  demo.style.display = naDemo ? "" : "none";
  if (naDemo) {
    const kIn = back(prog(t, C.demo - 0.2, C.demo + 0.35));
    const kOut = inOut(prog(t, C.depois - 0.35, C.depois));
    $("cel").style.transform = `scale(${(lerp(0.6, 1, kIn) * lerp(1, 0.7, kOut)).toFixed(3)}) rotate(${((1 - kIn) * -8 + Math.sin(tq * 2) * 1.2).toFixed(2)}deg)`;
    demo.style.opacity = (prog(t, C.demo - 0.2, C.demo + 0.05) * (1 - kOut)).toFixed(3);
    // qual tela está visível
    let tela = 0;
    PASSOS.forEach((p, i) => { if (t >= passoT(i) + 0.55) tela = i + 1; });
    if (t >= C.confirma) tela = 3;
    [0, 1, 2, 3].forEach((i) => ($("t" + i).style.opacity = i === tela ? 1 : 0));
    // dedo de massinha indo até o alvo e tocando
    const atual = PASSOS[Math.min(2, PASSOS.findIndex((p, i) => t < passoT(i) + 0.55) < 0 ? 2 : PASSOS.findIndex((p, i) => t < passoT(i) + 0.55))];
    const i = PASSOS.indexOf(atual);
    const ti = passoT(i);
    const [ax, ay] = atual.alvo;
    const px = 270 + 22 + ax * ESC, py = 470 + 22 + ay * ESC;    // posição do alvo na tela do palco
    const kd = inOut(prog(tq, ti - 0.35, ti));
    const aperta = t >= ti && t < ti + 0.18 ? 14 : 0;
    const dedo = $("dedo");
    dedo.style.display = t < C.confirma ? "" : "none";
    dedo.style.left = `${lerp(px + 160, px - 30, kd).toFixed(1)}px`;
    dedo.style.top = `${(lerp(py + 300, py - 20, kd) + aperta).toFixed(1)}px`;
    dedo.style.transform = "rotate(-18deg)";
    const toque = $("toque");
    const kr = prog(t, ti, ti + 0.45);
    toque.style.left = `${ax * ESC}px`; toque.style.top = `${ay * ESC}px`;
    toque.style.opacity = t >= ti && kr < 1 ? (1 - kr).toFixed(3) : 0;
    toque.style.transform = `scale(${lerp(0.4, 2, kr).toFixed(3)})`;
    // carimbo de confirmado
    const ko = back(prog(t, C.confirma, C.confirma + 0.4));
    $("ok").style.opacity = t >= C.confirma ? 1 : 0;
    $("ok").style.transform = `scale(${ko.toFixed(3)}) rotate(${((1 - ko) * 30).toFixed(1)}deg)`;
  }

  // ----- legendas -----
  const L = legendas.find((l) => t >= l.t0 && t < l.t1);
  const leg = $("leg"), chip = $("chip");
  if (L) {
    leg.style.display = ""; leg.innerHTML = L.txt.replace(/\n/g, "<br>");
    const k = back(prog(t, L.t0, L.t0 + 0.35));
    leg.style.transform = `scale(${(0.6 + 0.4 * k).toFixed(3)}) rotate(${((1 - k) * -4).toFixed(2)}deg)`;
    leg.style.top = L.chip ? "190px" : "250px"; leg.style.fontSize = L.chip ? "84px" : "120px";
    chip.style.display = L.chip ? "" : "none"; chip.textContent = L.chip; chip.style.background = L.cor;
  } else { leg.style.display = "none"; chip.style.display = "none"; }

  // ----- cartão final -----
  const fin = $("final");
  fin.style.display = t >= C.final - 0.25 ? "flex" : "none";
  fin.style.clipPath = `circle(${(prog(t, C.final - 0.25, C.final + 0.2) * 150).toFixed(1)}% at 50% 55%)`;
};

window.ready = (async () => { await document.fonts.ready; await Promise.all([...document.images].map((i) => (i.complete ? 0 : i.decode().catch(() => {})))); return true; })();
</script>
</body>
